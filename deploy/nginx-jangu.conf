upstream jangu_gunicorn {
    server unix:/run/jangu/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name jangumobile.site www.jangumobile.site;

    client_max_body_size 10m;

    location /media/ {
        alias /srv/jangu/app/backend/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://jangu_gunicorn;
        proxy_redirect off;
        proxy_set_header Host $host;
        # Django uses this for secure cookies and to build https:// image URLs.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite rather than append: DRF rate limits by this header, so a value
        # supplied by the client must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
