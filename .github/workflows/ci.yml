name: CI

on:
  push:
    branches: [main]
  pull_request:

# Same Python, Postgres and Ubuntu versions as production (see DEPLOY.md).
env:
  DATABASE_URL: postgresql://jangu:jangu@localhost:5432/jangu
  SECRET_KEY: ci-only-not-a-real-secret
  DEBUG: "True"

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jangu
          POSTGRES_PASSWORD: jangu
          POSTGRES_DB: jangu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jangu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        working-directory: backend
        run: python manage.py test
      - name: Build static files the way production does
        working-directory: backend
        env:
          DEBUG: "False"
        run: python manage.py collectstatic --no-input

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jangu
          POSTGRES_PASSWORD: jangu
          POSTGRES_DB: jangu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jangu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: pip install -r requirements.txt
      - name: Install Cypress
        working-directory: e2e
        run: npm ci
      - name: Prepare the database
        working-directory: backend
        run: |
          python manage.py migrate --no-input
          python manage.py load_catalogue
      - name: Start the site
        working-directory: backend
        run: |
          nohup python manage.py runserver --noreload 8000 > server.log 2>&1 &
          curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://localhost:8000/
      - name: Run browser tests
        working-directory: e2e
        run: npm run e2e
      - name: Keep screenshots and the server log if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            e2e/cypress/screenshots
            backend/server.log
